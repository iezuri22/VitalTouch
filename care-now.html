<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get care started | VitalTouch Health Network</title>
    <!-- This page asked the same four questions as consult.html at a second
         URL, which split the funnel and — worse — meant a family in crisis
         could land on the calm form and get the calm treatment. One form now:
         consult.html turns itself into the urgent version when someone
         answers "Right away" or "Leaving hospital or rehab", and the server
         reads urgency off that same answer rather than off which page it came
         from.

         Kept as a redirect rather than deleted: this URL is printed on
         collateral, sits in browser histories, and may be indexed. ?when=now
         preselects the urgency so nobody has to say "right away" twice.

         GitHub Pages can't issue a 301, so this is a meta refresh plus a JS
         replace() — replace() rather than href so the back button doesn't
         bounce the visitor straight back here. The link is there for anyone
         with JavaScript off. -->
    <link rel="canonical" href="https://vitaltouchcares.com/consult.html">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url=consult.html?when=now&amp;from=care-now">
    <script>
        location.replace('consult.html?when=now&from=care-now' + location.hash);
    </script>
    <link rel="icon" type="image/png" href="images/logo-symbol.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260808a">
</head>
<body>
    <main style="max-width: 620px; margin: 0 auto; padding: 80px 20px; text-align: center;">
        <h1 style="font-size: 1.8rem; margin-bottom: 12px;">Taking you to the right page&hellip;</h1>
        <p style="font-size: 1.08rem; line-height: 1.7; color: #4A5568;">
            If nothing happens,
            <a href="consult.html?when=now&amp;from=care-now" style="font-weight: 700;">tap here to tell us what you need</a>.
        </p>
        <p style="font-size: 1.08rem; line-height: 1.7; margin-top: 18px;">
            Need someone right now? Call
            <a href="tel:7087264536" style="font-weight: 700;">(708) 726-4536</a>.
        </p>
    </main>
</body>
</html>
