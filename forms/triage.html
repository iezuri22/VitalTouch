<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triage — VitalTouch Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink:        #0F1115;
    --ink-2:      #2A2F36;
    --ink-3:      #5A6471;
    --ink-4:      #8A93A0;
    --line:       #E6E8EC;
    --line-2:     #F0F2F5;
    --bg:         #FCFCFA;
    --bg-2:       #F7F8F5;
    --hover:      #F2F3EE;
    --selected:   #EBEEEA;
    --accent:     #1F6E3A;
    --accent-2:   #2F8A4D;
    --accent-bg:  #E8F1EA;
    --warn:       #8C5A00;
    --warn-bg:    #FBF1D8;
    --crit:       #8B1F1F;
    --crit-bg:    #F7E2E2;
    --neutral:    #5A6471;
    --neutral-bg: #EFF1F4;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 13.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01", "cv11";
  }

  /* ===== TOPBAR ===== */
  .top {
    height: 44px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center;
    padding: 0 16px;
    background: var(--bg);
    position: sticky; top: 0; z-index: 50;
    gap: 14px;
  }
  .top-mark {
    font-weight: 700; font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .top-mark .dot { color: var(--accent); }
  .top-sep { width: 1px; height: 16px; background: var(--line); }
  .top-crumb { font-size: 13px; color: var(--ink-3); }
  .top-crumb b { color: var(--ink); font-weight: 600; }
  .top-spacer { flex: 1; }
  .top-user {
    font-size: 12.5px; color: var(--ink-3);
    display: flex; align-items: center; gap: 8px;
  }
  .top-user .you { color: var(--ink-2); font-weight: 500; }
  .top-link {
    color: var(--ink-3);
    font-size: 12.5px;
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .top-link:hover { color: var(--ink); background: var(--hover); }

  /* ===== TOOLBAR ===== */
  .toolbar {
    border-bottom: 1px solid var(--line);
    padding: 14px 24px 12px;
    background: var(--bg);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .h-stack { display: flex; align-items: center; gap: 12px; }
  .h-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .h-tally {
    font-size: 12.5px;
    color: var(--ink-3);
    padding-bottom: 2px;
  }
  .h-tally b { color: var(--ink); font-weight: 600; }

  .filters { display: flex; gap: 2px; }
  .filter {
    background: none; border: 1px solid transparent;
    padding: 4px 10px;
    font-size: 12.5px; font-family: inherit;
    color: var(--ink-3);
    cursor: pointer;
    border-radius: 4px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .filter:hover { background: var(--hover); color: var(--ink); }
  .filter.on {
    color: var(--ink);
    background: var(--bg-2);
    border-color: var(--line);
  }
  .filter .num {
    background: var(--neutral-bg);
    color: var(--neutral);
    padding: 0 5px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    min-width: 18px;
    text-align: center;
  }
  .filter.on .num { background: var(--ink); color: var(--bg); }

  /* ===== TABLE ===== */
  .table {
    border-bottom: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 28px 56px 1fr 220px 100px 24px;
    align-items: center;
    border-bottom: 1px solid var(--line-2);
    padding: 0;
    cursor: pointer;
    transition: background 0.08s;
  }
  .row:hover { background: var(--hover); }
  .row.open { background: var(--selected); }

  .row-head {
    display: grid;
    grid-template-columns: 28px 56px 1fr 220px 100px 24px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-4);
    font-weight: 600;
    padding: 8px 0;
  }
  .row-head > div { padding: 0 12px; }

  .row > .c {
    padding: 11px 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .c-status { display: flex; align-items: center; justify-content: center; }
  .c-form {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .c-file {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12.5px;
    color: var(--ink);
  }
  .c-match {
    font-size: 13px;
    color: var(--ink-2);
  }
  .c-match .sub { color: var(--ink-4); font-size: 12px; }
  .c-time {
    font-size: 12.5px;
    color: var(--ink-3);
    text-align: right;
  }
  .c-chev {
    color: var(--ink-4);
    text-align: center;
    font-size: 11px;
    transition: transform 0.15s;
  }
  .row.open .c-chev { transform: rotate(90deg); color: var(--ink-2); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--neutral);
  }
  .status-dot.matched { background: var(--accent); }
  .status-dot.unmatched { background: var(--warn); }
  .status-dot.review { background: var(--crit); }
  .status-dot.urgent {
    background: var(--crit);
    box-shadow: 0 0 0 3px rgba(139,31,31,0.15);
  }

  /* ===== EXPANDED ROW ===== */
  .row-detail {
    display: none;
    border-bottom: 1px solid var(--line-2);
    background: var(--selected);
    padding: 4px 12px 18px 96px;
  }
  .row.open + .row-detail { display: block; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 24px;
    padding-top: 12px;
  }
  .detail-section {
    margin-bottom: 14px;
  }
  .detail-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-4);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .detail-value {
    font-size: 13.5px;
    color: var(--ink);
  }
  .detail-value.mono {
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12.5px;
  }
  .detail-value .id-pill {
    display: inline-block;
    background: var(--neutral-bg);
    color: var(--ink-2);
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 11.5px;
    margin-left: 4px;
  }
  .detail-meta-row {
    display: flex; gap: 20px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--ink-3);
    margin-top: 2px;
  }
  .detail-meta-row b { color: var(--ink-2); font-weight: 500; }

  .detail-banner {
    padding: 10px 12px;
    border-radius: 4px;
    font-size: 13px;
    margin-bottom: 14px;
    border: 1px solid transparent;
  }
  .detail-banner.matched {
    background: var(--accent-bg);
    color: #14542B;
    border-color: #B6D4BD;
  }
  .detail-banner.unmatched {
    background: var(--warn-bg);
    color: var(--warn);
    border-color: #E8D08A;
  }
  .detail-banner.review {
    background: var(--crit-bg);
    color: var(--crit);
    border-color: #DEB0B0;
  }
  .detail-banner b { font-weight: 600; }

  .actions {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding-top: 6px;
  }
  .btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-2);
    transition: all 0.1s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--hover); border-color: var(--ink-4); color: var(--ink); }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); color: var(--bg); }
  .btn-danger {
    color: var(--crit);
    border-color: transparent;
    background: transparent;
  }
  .btn-danger:hover { background: var(--crit-bg); border-color: transparent; }

  .key {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 4px;
    font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 11px;
    color: var(--ink-3);
    margin-left: 6px;
  }

  /* ===== EMPTY ===== */
  .empty {
    padding: 80px 24px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty-title {
    font-size: 14px;
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 4px;
  }
  .empty-sub { font-size: 13px; color: var(--ink-4); }

  /* ===== LOGIN ===== */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .login-box {
    width: 380px;
    padding: 32px;
    border: 1px solid var(--line);
    background: var(--bg);
  }
  .login-box .mark {
    font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .login-box .mark .dot { color: var(--accent); }
  .login-box h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .login-box p {
    font-size: 13px;
    color: var(--ink-3);
    margin-bottom: 22px;
  }
  .ms-btn {
    width: 100%;
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 9px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  }
  .ms-btn:hover { background: var(--ink-2); }
  .ms-logo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px; width: 13px; height: 13px;
  }
  .ms-logo span { display: block; }
  .ms-logo span:nth-child(1) { background: #F25022; }
  .ms-logo span:nth-child(2) { background: #7FBA00; }
  .ms-logo span:nth-child(3) { background: #00A4EF; }
  .ms-logo span:nth-child(4) { background: #FFB900; }
  .login-foot {
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--ink-4);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: var(--bg);
    padding: 9px 14px;
    border-radius: 4px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.18s;
    font-weight: 500;
  }
  .toast.on {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* responsive table — hide rare columns */
  @media (max-width: 760px) {
    .row, .row-head { grid-template-columns: 28px 56px 1fr 80px 24px; }
    .row > .c-match, .row-head > div:nth-child(4) { display: none; }
    .row-detail { padding-left: 16px; }
    .detail-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="mark">VITALTOUCH<span class="dot">·</span>OPS</div>
    <h1>Sign in to triage</h1>
    <p>Use your VitalTouch Microsoft account.</p>
    <button class="ms-btn" onclick="signIn()">
      <span class="ms-logo"><span></span><span></span><span></span><span></span></span>
      Continue with Microsoft
    </button>
    <div class="login-foot">Restricted to authorized personnel.</div>
  </div>
</div>

<!-- TOPBAR -->
<div class="top" style="display:none;" id="top">
  <span class="top-mark">VITALTOUCH<span class="dot">·</span>OPS</span>
  <span class="top-sep"></span>
  <span class="top-crumb">Triage <b>· Inbox</b></span>
  <span class="top-spacer"></span>
  <span class="top-user"><span class="you" id="userName">Ifeanyi Ezurike</span></span>
  <a class="top-link" href="#" onclick="signOut(); return false;">Sign out</a>
</div>

<!-- TOOLBAR -->
<div id="main" style="display:none;">
  <div class="toolbar">
    <div class="h-stack">
      <h2 class="h-title">Triage</h2>
      <span class="h-tally"><b id="hPending">0</b> pending · <span id="hToday">0</span> today</span>
    </div>
    <div class="filters">
      <button class="filter on" data-f="all" onclick="setFilter('all')">All <span class="num" id="fAll">0</span></button>
      <button class="filter" data-f="matched" onclick="setFilter('matched')">Matched <span class="num" id="fM">0</span></button>
      <button class="filter" data-f="unmatched" onclick="setFilter('unmatched')">Unmatched <span class="num" id="fU">0</span></button>
      <button class="filter" data-f="review" onclick="setFilter('review')">Needs review <span class="num" id="fR">0</span></button>
    </div>
  </div>

  <div class="row-head">
    <div></div>
    <div>Form</div>
    <div>Filename</div>
    <div>Match</div>
    <div style="text-align:right;">Submitted</div>
    <div></div>
  </div>

  <div id="rowList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── MOCK DATA ─────────────────────────────────
  const MOCK = [
    { id: 's1', form: 'C.11', formName: 'Client Intake', file: 'C.11_Smith-John_1955-03-12_2026-04-25.pdf',
      submittedAt: '2026-04-25T14:23:00Z', submittedBy: 'web · vitaltouchcares.com',
      status: 'matched', urgent: false,
      match: { id: 'VT-2026-014', name: 'J. Smith', dob: '1955-03-12', pop: 'Senior_Private_Pay' },
      payer: 'Private Pay · Self-Pay (cash, check, ACH)',
      destination: '/06_Clients/Active_Senior_Private_Pay/VT-2026-014/1_Intake/' },
    { id: 's2', form: 'C.41', formName: 'Monthly Log', file: 'C.41_Davis-Mary_1942-07-08_2026-04-25.pdf',
      submittedAt: '2026-04-25T13:01:00Z', submittedBy: 'CSM Sarah K.',
      status: 'matched', urgent: false,
      match: { id: 'VT-2026-007', name: 'M. Davis', dob: '1942-07-08', pop: 'IDoA-CCP' },
      payer: 'Public Program · Community Care Program (IDoA)',
      destination: '/06_Clients/Active_IDoA-CCP/VT-2026-007/3_Ongoing_Service_Records/' },
    { id: 's3', form: 'C.11', formName: 'Client Intake', file: 'C.11_Williams-Robert_1968-11-22_2026-04-25.pdf',
      submittedAt: '2026-04-25T11:45:00Z', submittedBy: 'web · vitaltouchcares.com',
      status: 'unmatched', urgent: false,
      newClient: { name: 'R. Williams', dob: '1968-11-22', pop: 'DRS-HSP' },
      payer: 'Public Program · DRS Home Services Program (IDHS)',
      destination: '/06_Clients/Active_DRS-HSP/[NEW client folder]/1_Intake/' },
    { id: 's4', form: 'C.44', formName: 'Incident Report', file: 'C.44_Lacey-Wayne_1949-02-15_2026-04-25.pdf',
      submittedAt: '2026-04-25T09:12:00Z', submittedBy: 'CSM Maria T.',
      status: 'matched', urgent: true,
      match: { id: 'VT-2025-001', name: 'W. Lacey', dob: '1949-02-15', pop: 'IDoA-CCP' },
      payer: 'Public Program · Community Care Program (IDoA)',
      destination: '/06_Clients/Active_IDoA-CCP/VT-2025-001/5_Incidents_and_Communications/' },
    { id: 's5', form: '?', formName: 'Unknown', file: 'C.11_unknown_2026-04-24.pdf',
      submittedAt: '2026-04-24T16:30:00Z', submittedBy: 'web · vitaltouchcares.com',
      status: 'review', urgent: false,
      reviewReason: 'Filename does not match expected format. Could not parse name or DOB.',
      payer: null, destination: null },
  ];

  // ── STATE ─────────────────────────────────────
  let queue = [];
  let filter = 'all';
  let openId = null;

  // ── AUTH ──────────────────────────────────────
  function signIn() {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('top').style.display = 'flex';
    document.getElementById('main').style.display = 'block';
    load();
  }
  function signOut() {
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('top').style.display = 'none';
    document.getElementById('main').style.display = 'none';
  }

  // ── LOAD (mock) ───────────────────────────────
  async function load() {
    queue = MOCK.slice();
    render();
  }

  // ── RENDER ────────────────────────────────────
  function render() {
    const tally = (s) => queue.filter(q => q.status === s).length;
    const visible = filter === 'all' ? queue : queue.filter(q => q.status === filter);

    document.getElementById('hPending').textContent = queue.length;
    document.getElementById('hToday').textContent = queue.filter(q => isToday(q.submittedAt)).length;
    document.getElementById('fAll').textContent = queue.length;
    document.getElementById('fM').textContent = tally('matched');
    document.getElementById('fU').textContent = tally('unmatched');
    document.getElementById('fR').textContent = tally('review');

    const list = document.getElementById('rowList');
    if (visible.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-title">Nothing to triage</div><div class="empty-sub">New submissions land here automatically. ${filter !== 'all' ? 'Try All to see other items.' : ''}</div></div>`;
      return;
    }

    list.innerHTML = visible.map(rowHtml).join('');
    list.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', () => toggle(el.dataset.id));
    });
  }

  function rowHtml(item) {
    const isOpen = item.id === openId;
    const dotCls = item.urgent ? 'urgent' : item.status;
    const matchText = item.status === 'matched'
      ? `${item.match.name} <span class="sub">· ${item.match.id}</span>`
      : item.status === 'unmatched'
        ? `<span style="color:var(--warn);">+ new · ${item.newClient.name}</span>`
        : `<span style="color:var(--crit);">manual review</span>`;

    return `
      <div class="row${isOpen ? ' open' : ''}" data-id="${item.id}">
        <div class="c c-status"><span class="status-dot ${dotCls}"></span></div>
        <div class="c c-form">${item.form}</div>
        <div class="c c-file">${item.file}</div>
        <div class="c c-match">${matchText}</div>
        <div class="c c-time">${timeAgo(item.submittedAt)}</div>
        <div class="c c-chev">▸</div>
      </div>
      <div class="row-detail">${detailHtml(item)}</div>`;
  }

  function detailHtml(item) {
    let banner;
    if (item.status === 'matched') {
      banner = `<div class="detail-banner matched">Auto-matched on name + DOB. Approve to file into the destination folder, or reassign manually.</div>`;
    } else if (item.status === 'unmatched') {
      banner = `<div class="detail-banner unmatched">No existing client matched. Likely a new intake — confirm to create the roster entry and folder.</div>`;
    } else {
      banner = `<div class="detail-banner review"><b>Manual review required.</b> ${item.reviewReason || ''}</div>`;
    }

    const left = `
      <div>
        ${banner}
        <div class="detail-section">
          <div class="detail-label">${item.status === 'matched' ? 'Suggested client' : item.status === 'unmatched' ? 'Proposed new client' : 'Submission'}</div>
          ${item.status === 'matched' ? `
            <div class="detail-value">${item.match.name}<span class="id-pill">${item.match.id}</span></div>
            <div class="detail-meta-row">
              <span>DOB <b>${item.match.dob}</b></span>
              <span>Population <b>${item.match.pop.replace(/_/g, ' ')}</b></span>
            </div>` : item.status === 'unmatched' ? `
            <div class="detail-value">${item.newClient.name}</div>
            <div class="detail-meta-row">
              <span>DOB <b>${item.newClient.dob}</b></span>
              <span>Population <b>${item.newClient.pop.replace(/_/g, ' ')}</b></span>
            </div>` : `
            <div class="detail-value mono">${item.file}</div>`}
        </div>
        ${item.payer ? `
        <div class="detail-section">
          <div class="detail-label">Payer</div>
          <div class="detail-value">${item.payer}</div>
        </div>` : ''}
        ${item.destination ? `
        <div class="detail-section">
          <div class="detail-label">Destination</div>
          <div class="detail-value mono">${item.destination}</div>
        </div>` : ''}
      </div>`;

    const right = `
      <div>
        <div class="detail-section">
          <div class="detail-label">Submission</div>
          <div class="detail-value mono">${item.file}</div>
          <div class="detail-meta-row">
            <span>${item.formName}</span>
            <span>·</span>
            <span>by ${item.submittedBy}</span>
          </div>
          <div class="detail-meta-row">
            <span>${new Date(item.submittedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })}</span>
          </div>
        </div>
        <div class="actions">
          ${item.status === 'matched' ? `
            <button class="btn btn-primary" onclick="event.stopPropagation(); approve('${item.id}')">Approve & file <span class="key">A</span></button>
            <button class="btn" onclick="event.stopPropagation(); reassign('${item.id}')">Reassign</button>
            <button class="btn" onclick="event.stopPropagation(); viewPdf('${item.id}')">Open PDF</button>
            <button class="btn btn-danger" onclick="event.stopPropagation(); reject('${item.id}')">Reject</button>` : item.status === 'unmatched' ? `
            <button class="btn btn-primary" onclick="event.stopPropagation(); createNew('${item.id}')">Create client & file <span class="key">N</span></button>
            <button class="btn" onclick="event.stopPropagation(); reassign('${item.id}')">Match existing</button>
            <button class="btn" onclick="event.stopPropagation(); viewPdf('${item.id}')">Open PDF</button>
            <button class="btn btn-danger" onclick="event.stopPropagation(); reject('${item.id}')">Reject</button>` : `
            <button class="btn btn-primary" onclick="event.stopPropagation(); reassign('${item.id}')">Manual match</button>
            <button class="btn" onclick="event.stopPropagation(); viewPdf('${item.id}')">Open PDF</button>
            <button class="btn btn-danger" onclick="event.stopPropagation(); reject('${item.id}')">Reject</button>`}
        </div>
      </div>`;
    return `<div class="detail-grid">${left}${right}</div>`;
  }

  // ── INTERACTIONS ──────────────────────────────
  function toggle(id) {
    openId = (openId === id) ? null : id;
    render();
  }
  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter').forEach(el => el.classList.toggle('on', el.dataset.f === f));
    openId = null;
    render();
  }
  function approve(id) {
    const it = queue.find(q => q.id === id);
    toast(`Filed → ${it.match.name} · ${it.match.id}`);
    queue = queue.filter(q => q.id !== id); openId = null; render();
  }
  function createNew(id) {
    const it = queue.find(q => q.id === id);
    toast(`Created roster entry · ${it.newClient.name}`);
    queue = queue.filter(q => q.id !== id); openId = null; render();
  }
  function reassign(id) { toast('Reassign — picker not wired'); }
  function viewPdf(id)  { toast('Open PDF — viewer not wired'); }
  function reject(id) {
    if (!confirm('Reject this submission? It moves to /99_Archive/_Rejected/.')) return;
    queue = queue.filter(q => q.id !== id); openId = null; render();
    toast('Submission rejected');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2400);
  }

  // ── KEYBOARD ──────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('top').style.display === 'none') return;
    const visible = filter === 'all' ? queue : queue.filter(q => q.status === filter);
    if (visible.length === 0) return;

    const idx = visible.findIndex(q => q.id === openId);
    if (e.key === 'j') {
      e.preventDefault();
      const next = idx < 0 ? 0 : Math.min(visible.length - 1, idx + 1);
      openId = visible[next].id; render();
    } else if (e.key === 'k') {
      e.preventDefault();
      const prev = idx < 0 ? 0 : Math.max(0, idx - 1);
      openId = visible[prev].id; render();
    } else if (e.key === 'a' && openId) {
      const it = queue.find(q => q.id === openId);
      if (it && it.status === 'matched') approve(openId);
    } else if (e.key === 'n' && openId) {
      const it = queue.find(q => q.id === openId);
      if (it && it.status === 'unmatched') createNew(openId);
    } else if (e.key === 'Escape') {
      openId = null; render();
    }
  });

  // ── HELPERS ───────────────────────────────────
  function isToday(iso) { return iso.startsWith(new Date().toISOString().slice(0, 10)); }
  function timeAgo(iso) {
    const d = new Date(iso);
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60)        return Math.floor(diff) + 's ago';
    if (diff < 3600)      return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400)     return Math.floor(diff / 3600) + 'h ago';
    if (diff < 86400 * 7) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // auto-skip login in mock
  signIn();
</script>
</body>
</html>
